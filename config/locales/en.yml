# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  hello: "Hello world"

  # 회원가입 폼에서 노출되는 User 검증 오류 문구만 한글 처리(AUTH-1 — 기본 로캘 :en 유지)
  activerecord:
    errors:
      models:
        user:
          attributes:
            email:
              blank: "이메일을 입력해 주세요."
              taken: "이미 등록된 이메일입니다"
            password:
              blank: "비밀번호를 입력해 주세요."
              password_too_long: "비밀번호가 너무 깁니다. 72자 이내로 입력해 주세요."
            password_confirmation:
              confirmation: "비밀번호 확인이 일치하지 않습니다."
            display_name:
              blank: "표시명(또는 상호)을 입력해 주세요."
            business_type:
              blank: "사업자 유형을 선택해 주세요."
            phone:
              invalid: "연락처 형식이 올바르지 않습니다. 예) 010-1234-5678"
            account_number:
              invalid: "계좌번호 형식을 확인해 주세요. 숫자와 하이픈(-)으로 5자 이상 입력해 주세요."
        client:
          attributes:
            name:
              blank: "거래처명을 입력해 주세요."
            contact_name:
              blank: "담당자명을 입력해 주세요."
            phone:
              blank: "휴대폰 번호를 입력해 주세요."
              invalid: "휴대폰 번호 형식이 올바르지 않습니다. 예) 010-1234-5678"
            email:
              invalid: "이메일 형식이 올바르지 않습니다. 예) name@example.com"
        item:
          attributes:
            name:
              blank: "품목명을 입력해 주세요."
            unit_price:
              blank: "단가를 입력해 주세요."
              not_a_number: "단가는 0원 이상의 정수로 입력해 주세요."
              not_an_integer: "단가는 0원 이상의 정수로 입력해 주세요."
              greater_than_or_equal_to: "단가는 0원 이상의 정수로 입력해 주세요."
              # 수치는 app/models/item.rb의 Item::MAX_UNIT_PRICE와 짝을 이룬다.
              less_than_or_equal_to: "단가는 1,000,000,000원 이하로 입력해 주세요."
        invoice:
          attributes:
            client:
              # belongs_to 검증 오류 속성은 client(연관)이며 required 키를 사용한다
              required: "거래처를 선택해 주세요."
            client_id:
              blank: "거래처를 선택해 주세요."
            due_on:
              blank: "만기일을 입력해 주세요."
            bank_name:
              blank: "입금 은행을 선택해 주세요."
            account_number:
              blank: "계좌번호를 입력해 주세요."
            account_holder:
              blank: "예금주를 입력해 주세요."
            base:
              # 발행 시 0원 청구서 차단 — app/models/invoice.rb의
              # total_amount_must_be_positive(on: :issue)와 짝을 이룬다.
              total_amount_must_be_positive: "청구서 총액은 1원 이상이어야 합니다"
        invoice_item:
          attributes:
            description:
              blank: "품목 설명을 입력해 주세요."
            quantity:
              blank: "수량을 입력해 주세요."
              not_a_number: "수량은 1 이상의 정수로 입력해 주세요."
              not_an_integer: "수량은 1 이상의 정수로 입력해 주세요."
              # 수치는 app/models/invoice_item.rb의 MAX_QUANTITY와 짝을 이룬다.
              greater_than_or_equal_to: "수량은 1 이상의 정수로 입력해 주세요."
              less_than_or_equal_to: "수량은 10,000 이하로 입력해 주세요."
            unit_price:
              blank: "단가를 입력해 주세요."
              not_a_number: "단가는 0원 이상의 정수로 입력해 주세요."
              not_an_integer: "단가는 0원 이상의 정수로 입력해 주세요."
              greater_than_or_equal_to: "단가는 0원 이상의 정수로 입력해 주세요."
              less_than_or_equal_to: "단가는 1,000,000,000원 이하로 입력해 주세요."
