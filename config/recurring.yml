# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

# F-PLAN 구독 생명주기 잡 — 매일 06:00 KST(TIME-1). fugit 크론의 타임존 접미사로 KST 고정하며,
# 갱신(renewal)을 강등 체크(expiry) 5분 뒤에 돌려 체험 만료 대상이 갱신 경합에 걸리지 않게 한다.
production:
  subscription_trial_expiry:
    class: SubscriptionTrialExpiryJob
    schedule: "0 6 * * * Asia/Seoul"
  subscription_renewal:
    class: SubscriptionRenewalJob
    schedule: "5 6 * * * Asia/Seoul"
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  # F-REM 리마인더 시퀀스(TIME-1 — KST fugit 접미사). 연체 저장화는 매일(만기 경과는 상태 표기
  # 문제라 주말에도 전환), 사전통보·발송은 평일 전용(REM-3 — 주말 스텝은 소급 창에서 월요일로
  # 자연 이연되며, 09시 사전통보 → 14시 발송 사이가 U1 취소 창(REM-11)이다).
  reminders_overdue_mark:
    class: Reminders::OverdueMarkJob
    schedule: "0 7 * * * Asia/Seoul"
  reminders_prenotice:
    class: Reminders::PrenoticeJob
    schedule: "0 9 * * 1-5 Asia/Seoul"
  reminders_dispatch:
    class: Reminders::DispatchJob
    schedule: "0 14 * * 1-5 Asia/Seoul"
  # INV-7 반복 청구 자동 발행 — 매일 06:30 KST(TIME-1). 발행 안내(issue_notice)는 09시 사전통보
  # 이전에 큐에 들어가도 잡 실행은 SendService 창 가드를 통과한다.
  recurring_invoices_issue:
    class: RecurringInvoices::IssueJob
    schedule: "30 6 * * * Asia/Seoul"
  # ADMIN-10·BLOG-5·Q20 — 예약 발행 스캔. [W-3(05_review) 정정] scheduled 게시글은 이 매분
  # 스캔이 published로 전환한 뒤 노출된다(최대 1분 지연 — 도과 시 published 전환·멱등).
  blog_posts_publish_scheduled:
    class: BlogPosts::PublishScheduledJob
    schedule: "* * * * * Asia/Seoul"

development:
  subscription_trial_expiry:
    class: SubscriptionTrialExpiryJob
    schedule: "0 6 * * * Asia/Seoul"
  subscription_renewal:
    class: SubscriptionRenewalJob
    schedule: "5 6 * * * Asia/Seoul"
  reminders_overdue_mark:
    class: Reminders::OverdueMarkJob
    schedule: "0 7 * * * Asia/Seoul"
  reminders_prenotice:
    class: Reminders::PrenoticeJob
    schedule: "0 9 * * 1-5 Asia/Seoul"
  reminders_dispatch:
    class: Reminders::DispatchJob
    schedule: "0 14 * * 1-5 Asia/Seoul"
  # INV-7 반복 청구 자동 발행 — 매일 06:30 KST(TIME-1). 발행 안내(issue_notice)는 09시 사전통보
  # 이전에 큐에 들어가도 잡 실행은 SendService 창 가드를 통과한다.
  recurring_invoices_issue:
    class: RecurringInvoices::IssueJob
    schedule: "30 6 * * * Asia/Seoul"
  # ADMIN-10·BLOG-5·Q20 — 예약 발행 스캔(매분 — production 블록 주석 참조).
  blog_posts_publish_scheduled:
    class: BlogPosts::PublishScheduledJob
    schedule: "* * * * * Asia/Seoul"
