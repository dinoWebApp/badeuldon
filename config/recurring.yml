# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

# F-PLAN 구독 생명주기 잡 — 매일 06:00 KST(TIME-1). fugit 크론의 타임존 접미사로 KST 고정하며,
# 갱신(renewal)을 강등 체크(expiry) 5분 뒤에 돌려 체험 만료 대상이 갱신 경합에 걸리지 않게 한다.
production:
  subscription_trial_expiry:
    class: SubscriptionTrialExpiryJob
    schedule: "0 6 * * * Asia/Seoul"
  subscription_renewal:
    class: SubscriptionRenewalJob
    schedule: "5 6 * * * Asia/Seoul"
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  # F-REM 리마인더 시퀀스(TIME-1 — KST fugit 접미사). 연체 저장화는 매일(만기 경과는 상태 표기
  # 문제라 주말에도 전환), 사전통보·발송은 평일 전용(REM-3 — 주말 스텝은 소급 창에서 월요일로
  # 자연 이연되며, 09시 사전통보 → 14시 발송 사이가 U1 취소 창(REM-11)이다).
  reminders_overdue_mark:
    class: Reminders::OverdueMarkJob
    schedule: "0 7 * * * Asia/Seoul"
  reminders_prenotice:
    class: Reminders::PrenoticeJob
    schedule: "0 9 * * 1-5 Asia/Seoul"
  reminders_dispatch:
    class: Reminders::DispatchJob
    schedule: "0 14 * * 1-5 Asia/Seoul"
  # INV-7 반복 청구 자동 발행 — 매일 06:30 KST(TIME-1). 발행 안내(issue_notice)는 09시 사전통보
  # 이전에 큐에 들어가도 잡 실행은 SendService 창 가드를 통과한다.
  recurring_invoices_issue:
    class: RecurringInvoices::IssueJob
    schedule: "30 6 * * * Asia/Seoul"
  # ADMIN-10·BLOG-5·Q20 — 예약 발행 스캔. [W-3(05_review) 정정] scheduled 게시글은 이 매분
  # 스캔이 published로 전환한 뒤 노출된다(최대 1분 지연 — 도과 시 published 전환·멱등).
  blog_posts_publish_scheduled:
    class: BlogPosts::PublishScheduledJob
    schedule: "* * * * * Asia/Seoul"
  # NOTI-2 주간 다이제스트 — 매주 월요일 09:00 KST(TIME-1). 템플릿 미등록 상태라 모든 발송은
  # skipped(NO_TEMPLATE) 기록으로 흡수된다(NOTI-3 선례 — 등록 후 자동 활성화).
  noti2_weekly_digest:
    class: Noti::WeeklyDigestJob
    schedule: "0 9 * * 1 Asia/Seoul"
  # F-SALES(SALES-2) — 추천 코드 주간 로테이션. 활동 직원 전체 새 코드 발급·기존 조기 종료.
  # 당일 발급분 가드로 멱등(재실행 무변경). 다이제스트(09시)보다 먼저 돌려 만료 안내 정합 유지.
  sales_referral_codes_rotate:
    class: Sales::RotateReferralCodesJob
    schedule: "0 0 * * 1 Asia/Seoul"
  # F-SALES(SALES-5·Q24) — 월 수수료 정산 스냅샷. 직전월 Plus 월결제 실차감액을 유치자별
  # 집계·역할 정책(sales 20%/12개월 캡·officer 15%/무기한) 적용 upsert(복합 유니크 — 멱등).
  sales_monthly_settlement:
    class: Sales::MonthlySettlementJob
    schedule: "5 0 1 * * Asia/Seoul"

development:
  subscription_trial_expiry:
    class: SubscriptionTrialExpiryJob
    schedule: "0 6 * * * Asia/Seoul"
  subscription_renewal:
    class: SubscriptionRenewalJob
    schedule: "5 6 * * * Asia/Seoul"
  reminders_overdue_mark:
    class: Reminders::OverdueMarkJob
    schedule: "0 7 * * * Asia/Seoul"
  reminders_prenotice:
    class: Reminders::PrenoticeJob
    schedule: "0 9 * * 1-5 Asia/Seoul"
  reminders_dispatch:
    class: Reminders::DispatchJob
    schedule: "0 14 * * 1-5 Asia/Seoul"
  # INV-7 반복 청구 자동 발행 — 매일 06:30 KST(TIME-1). 발행 안내(issue_notice)는 09시 사전통보
  # 이전에 큐에 들어가도 잡 실행은 SendService 창 가드를 통과한다.
  recurring_invoices_issue:
    class: RecurringInvoices::IssueJob
    schedule: "30 6 * * * Asia/Seoul"
  # ADMIN-10·BLOG-5·Q20 — 예약 발행 스캔(매분 — production 블록 주석 참조).
  blog_posts_publish_scheduled:
    class: BlogPosts::PublishScheduledJob
    schedule: "* * * * * Asia/Seoul"
  # NOTI-2 주간 다이제스트(production 블록 주석 참조).
  noti2_weekly_digest:
    class: Noti::WeeklyDigestJob
    schedule: "0 9 * * 1 Asia/Seoul"
  # F-SALES(SALES-2) 추천 코드 주간 로테이션(production 블록 주석 참조).
  sales_referral_codes_rotate:
    class: Sales::RotateReferralCodesJob
    schedule: "0 0 * * 1 Asia/Seoul"
  # F-SALES(SALES-5·Q24) 월 수수료 정산 스냅샷(production 블록 주석 참조).
  sales_monthly_settlement:
    class: Sales::MonthlySettlementJob
    schedule: "5 0 1 * * Asia/Seoul"

