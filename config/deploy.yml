# 운영 배포 설정 — CF Tunnel → kamal-proxy(127.0.0.1:3000) → Puma (AGENTS.md 「배포 인프라」)
# 서버: Tailscale 100.98.162.61 · SSH kgj · 도메인 badeuldon.kr
service: badeuldon
image: badeuldon

# web(HTTP)·job(Solid Queue) 분리 — SOLID_QUEUE_IN_PUMA 미사용(규약 §11.3)
servers:
  web:
    - 100.98.162.61
  job:
    hosts:
      - 100.98.162.61
    cmd: bin/jobs

ssh:
  user: kgj

# SSL은 Cloudflare가 종단(터널) — kamal-proxy는 http 수신.
# 127.0.0.1 바인딩으로 cloudflared만 도달 가능(공개 포트 0).
# production.rb의 assume_ssl + force_ssl이 전제다.
# (http_port·bind_ips는 Kamal 2.12 기준 proxy.run 아래에 둔다)
proxy:
  ssl: false
  run:
    http_port: 3000
    bind_ips: [ 127.0.0.1 ]

# 레지스트리 — 서버 공유 인프라로 독립 운영(여러 서비스 공용, badeuldon Kamal accessory 미관리)
# Kamal에서는 push/pull 대상으로만 참조한다(레지스트리 자체의 실행·백업은 Kamal 관리 밖).
# Tailscale 망 내 HTTP — 양단 Docker insecure-registries 등록 전제.
registry:
  server: 100.98.162.61:5000
  # registry:3 무인증(오픈) 레지스트리 — Kamal 검증상 username이 필수라 더미 자격증명을
  # 쓴다(무인증 레지스트리의 docker login은 항상 성공). 실값은 .kamal/secrets 참조.
  username: badeuldon
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# SQLite(storage) 영속 볼륨 — 서버 백업 필수
volumes:
  - "badeuldon_storage:/rails/storage"

asset_path: /rails/public/assets

# arm64 Mac → amd64 서버 크로스 빌드
builder:
  arch: amd64
