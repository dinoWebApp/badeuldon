<%# 청구서(INV) fixtures — 전부 delta 소유. gamma·beta·alpha는 0건 유지:
    gamma는 대시보드 빈 상태 검증, alpha·beta는 기존 테스트가 사용자·거래처 삭제(FK 연쇄)를
    검증하므로 청구서를 두면 외래 키 제약으로 기존 스위트가 깨진다(ClientTest·SessionsControllerTest).
    상태별 최소 1건(draft·issued·연체 파생·연체 enum·7일 내 만기·viewed·promised·partially_paid·
    paid·voided) + 타인 품목 위조 검증용 초안. 기준 테스트 일자 = 2026-10-12(KST, TIME-1) —
    날짜 파생 어설션 테스트는 travel_to("2026-10-12 09:00")로 고정한다. 금액 컬럼은
    Invoice.compute_amounts 산식과 일치하는 스냅샷값(픽스처는 콜백 없이 적재됨). 토큰은 43자
    urlsafe 고정값(추측 불가 엔트로피 검증은 발행 생성 경로에서 별도 수행 — SHARE-1).
    token_expires_at은 KST 오프셋을 명시한다(모델 발행값 = 만기일 end_of_day KST — 무오프셋
    문자열은 UTC로 저장되어 만료 판정·만료 임박 경계가 9시간 어긋난다). %>

