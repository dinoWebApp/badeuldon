# F-ADMIN Run A 테스트 표준 세트(AUTH-7).
# ops — owner·2FA 등록 완료 / newbie — owner·2FA 미등록 / staffuser — staff 롤.
# 비밀번호는 전부 "password".
# otp_secret은 fixture 로딩이 encrypts를 우회해 원문 저장되므로 여기서 넣지 않고
# 테스트 setup에서 update!로 주입한다(encrypts 경유 — AdminSessionTestHelper 참조).
ops:
  email: ops@example.com
  password_digest: <%= BCrypt::Password.create("password") %>
  role: owner
  otp_confirmed_at: <%= 1.day.ago %>
  failed_attempts: 0

newbie:
  email: newbie@example.com
  password_digest: <%= BCrypt::Password.create("password") %>
  role: owner
  failed_attempts: 0

staffuser:
  email: staff@example.com
  password_digest: <%= BCrypt::Password.create("password") %>
  role: staff
  otp_confirmed_at: <%= 1.day.ago %>
  failed_attempts: 0
