<%# 비밀번호 다이제스트 — 세 사용자 모두 평문 "password" (Rails 표준 ERB 산출) %>
<% password_digest = BCrypt::Password.create("password") %>

<%# alpha·beta — 프로필 미설정(AUTH-1.3 미완료): 로그인 직후 /app/profile/edit 리다이렉트 분기 기준 %>
alpha:
  email: alpha@example.com
  password_digest: <%= password_digest %>

beta:
  email: beta@example.com
  password_digest: <%= password_digest %>

<%# gamma — 프로필 완료(AUTH-1.3 6필드 설정): 로그인 직후 root 리다이렉트 분기 기준 %>
gamma:
  email: gamma@example.com
  password_digest: <%= password_digest %>
  display_name: "감마스튜디오"
  business_type: freelancer
  bank_name: "국민은행"
  account_number: "123-45-678901"
  account_holder: "김감마"
  phone: "010-9876-5432"

<%# delta — 프로필 완료 + 청구서 fixtures 소유(INV 테스트 전용).
    alpha·beta는 기존 테스트가 사용자·거래처 삭제(FK 연쇄)를 검증하므로 청구서를 두면 안 된다. %>
delta:
  email: delta@example.com
  password_digest: <%= password_digest %>
  display_name: "델타디자인"
  business_type: freelancer
  bank_name: "신한은행"
  account_number: "110-234-567890"
  account_holder: "김델타"
  phone: "010-5555-1111"

<%# epsilon — F-PLAN 구독 테스트 전용(profile 완료 — /app 진입 가드 통과).
    청구서·거래처 없음. 구독 행은 subscriptions.yml(epsilon_plus_active)에서 제공하며,
    fixture 적재는 콜백을 우회하므로 after_create 자동 생성과 충돌하지 않는다.
    alpha·beta·gamma·delta는 구독 행 없는 폴백(Free 상수) 판정을 기존 테스트가 전제하므로
    구독 fixture를 붙이지 않는다 — Plus 생명주기 상태는 테스트 내 create_subscription!로 만든다. %>
epsilon:
  email: epsilon@example.com
  password_digest: <%= password_digest %>
  display_name: "엡실론컨설팅"
  business_type: business
  bank_name: "우리은행"
  account_number: "1002-345-678901"
  account_holder: "김엡실론"
  phone: "010-2222-3333"
