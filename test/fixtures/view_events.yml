<%# 열람 이벤트(SHARE-3) fixtures — 발행 상세 열람 이력 요약(최초·최근·횟수)과 재열람
    검증에 쓴다. delta_viewed에만 둔다: issued 계열(delta_issued 등)은 뷰어 테스트가
    0건 기준으로 최초 열람(first=true)을 검증해야 하므로 이벤트를 미리 두지 않는다.
    viewed_at은 KST 절대시각 고정(TIME-1 — 무오프셋 문자열은 UTC로 저장되므로 오프셋 명시).
    ip는 문서화 예 대역(RFC 5737·10064). %>
delta_viewed_first:
  invoice: delta_viewed
  first: true
  device: mobile
  ip: "203.0.113.10"
  viewed_at: "2026-09-06 09:30:00 +0900"

delta_viewed_second:
  invoice: delta_viewed
  first: false
  device: pc
  ip: "198.51.100.7"
  viewed_at: "2026-09-20 18:05:00 +0900"
