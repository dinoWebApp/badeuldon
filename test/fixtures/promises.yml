<%# 응답·약속(F-PROMISE) fixtures — 전부 delta 소유 청구서에 접수된 것으로 기록한다(P4 — 응답
    이력 영구 보존). 상태별 최소 세트: 약속 이력 2건(재응답 — 최신 판정은 created_at desc·id desc
    이중 정렬이므로 created_at과 파일 순서를 같은 방향으로 둔다)·입금 완료 회신(PROMISE-7 —
    unsettled 청구서 접수 → DASH-2 마감 대기)·무답변 문의(PROMISE-6 — 답변 대기·답변 폼 렌더
    기준)·답변 완료 문의(뷰어 「발행인 답변」 표시 기준). kind별 필드 무결성(Phase 6 #1)을
    그대로 반영한다: paid_report·inquiry에 promised_on 없음, 비-inquiry에 memo 없음.
    delta_issued·delta_overdue·delta_paid·delta_voided·delta_draft은 응답 0건 유지 — 뷰어 POST
    시나리오의 클린 슬레이트이며 이력 카운트 산술을 단순하게 유지한다. 일시는 KST 오프셋을
    명시한다(무오프셋 문자열은 UTC로 저장 — display_datetime 표기 어긋남). %>

# ── 약속 이력 2건 — 재응답(약속 변경) 시나리오 기준. 청구서 상태는 promised ──
delta_this_week_promise:
  invoice: delta_promised
  kind: this_week
  promised_on: "2026-10-16"
  created_at: "2026-10-13 10:00:00 +0900"
  updated_at: "2026-10-13 10:00:00 +0900"

delta_date_selected_promise:
  invoice: delta_promised
  kind: date_selected
  promised_on: "2026-10-23"
  created_at: "2026-10-14 09:30:00 +0900"
  updated_at: "2026-10-14 09:30:00 +0900"

# ── 입금 완료 회신(PROMISE-7) — unsettled(partially_paid) 접수 → DASH-2 마감 대기 카드 ──
delta_paid_report_promise:
  invoice: delta_partially_paid
  kind: paid_report
  created_at: "2026-10-13 11:00:00 +0900"
  updated_at: "2026-10-13 11:00:00 +0900"

# ── 무답변 문의(PROMISE-6) — DASH-2 답변 대기 카드 + 청구서 상세 답변 폼 렌더 기준 ──
delta_unanswered_inquiry:
  invoice: delta_due_soon
  kind: inquiry
  memo: "입금 계좌가 변경되었는지 확인 부탁드립니다."
  created_at: "2026-10-13 12:00:00 +0900"
  updated_at: "2026-10-13 12:00:00 +0900"

# ── 답변 완료 문의(PROMISE-6) — 뷰어 「발행인 답변」 표시·answered 스코프 기준 ──
delta_answered_inquiry:
  invoice: delta_viewed
  kind: inquiry
  memo: "부가세 포함 금액인가요?"
  answer: "청구 총액에 부가세가 포함된 금액입니다."
  answered_at: "2026-10-14 10:00:00 +0900"
  created_at: "2026-10-13 13:00:00 +0900"
  updated_at: "2026-10-14 10:00:00 +0900"
